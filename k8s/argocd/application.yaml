# Argo CD Application — watches Gitea (or any git remote) and syncs k8s/demo-app.
# Repo URL is patched by scripts/argocd_bonus_up.sh to match local Gitea.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iow-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea.iow.svc.cluster.local:3000/iow/inception-of-wisdom.git
    targetRevision: iow/auto-heal
    path: k8s/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: iow-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
