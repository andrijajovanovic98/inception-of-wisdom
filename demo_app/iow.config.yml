# Inception-of-Wisdom (IoW) - Target Configuration
# All timing values and safety bounds MUST be read from this file dynamically.
# Hard-coded timing values are strictly forbidden by the subject.
#
# Every key below is live: the agent re-reads this file whenever its mtime changes,
# so a peer can retune the loop mid-defense without restarting anything. The agent is
# also forbidden from patching this file, and a rollback preserves your edits.

# ==============================================================================
# Wisdom Loop Safety Bounds (Subject Mandatory)
# ==============================================================================
grace_period: 20        # Seconds the target must stay up to count as healed
cooldown: 300           # Seconds before the same crash signature may retrigger
rate_limit_per_hour: 5  # Maximum heals started per hour
hard_cap: 20            # Maximum heals over the lifetime of the process
kill_switch: false      # Flip to true to immediately refuse every new heal

# ==============================================================================
# Observer Configuration (Container & HTTP Probes)
# ==============================================================================
target:
  container_name: "iow_demo_target"
  service_url: "http://demo_app:5000"
  probe_interval_seconds: 3
  probe_timeout_seconds: 2
  # Seconds of matching log lines collapsed into one incident, so a traceback
  # raises a single crash event instead of one per line.
  incident_debounce_seconds: 1.0
  # Sliding deduplication windows. One bad start must raise one event, so the crash
  # window has to outlast Docker's exponential restart backoff; suggestions use the
  # longer window the subject asks for.
  crash_dedup_window_seconds: 60
  suggestion_dedup_window_seconds: 300
  probe_urls:
    - "/"
    - "/healthz"
    # 4xx -> a *suggestion*: surfaced for a human, never auto-patched.
    - "/api/missing-route"
  # These are regular expressions. Literal parentheses must be escaped, otherwise
  # "(most recent call last)" is read as a capture group and the pattern silently
  # matches nothing at all. Use \w* rather than \b before Error/Exception: there is
  # no word boundary inside "RuntimeError", so "\bError:" would miss it.
  error_patterns:
    - "Traceback \\(most recent call last\\):"
    - "CRITICAL:"
    - "\\w*(?:Error|Exception):"
    - "ModuleNotFoundError"
    - "ImportError"
    - "SyntaxError"

# ==============================================================================
# Analyst Configuration (Local Model & Retrieval)
# ==============================================================================
analyst:
  model: "qwen2.5-coder:1.5b"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 3
  # Watch mode: how often the index reconciles with the target source tree.
  watch_interval_seconds: 3
