# Inception-of-Wisdom (IoW) - Target Configuration
# All timing values and safety bounds MUST be read from this file dynamically.
# Hard-coded timing values are strictly forbidden by the subject.
#
# The agent re-reads this file whenever it changes, so a peer can retune the loop
# mid-defense without restarting anything: every key is live except
# target.container_name, target.service_url, analyst.model and
# analyst.embedding_model, which are read once at start-up. A value that is not
# usable keeps the last good one. The agent is also forbidden from patching this
# file, and a rollback preserves your edits.

# ==============================================================================
# Wisdom Loop Safety Bounds (Subject Mandatory)
# ==============================================================================
grace_period: 20        # Seconds the target must stay up to count as healed
cooldown: 300           # Seconds before the same crash signature may retrigger
rate_limit_per_hour: 5  # Maximum heals started per hour
hard_cap: 20            # Maximum heals over the lifetime of the process
boot_timeout: 45        # Seconds a redeployed target may take to answer before the attempt fails
kill_switch: false      # Flip to true to immediately refuse every new heal
                        # (true/false/yes/no/on/off; anything else keeps the last value)

# ==============================================================================
# Observer Configuration (Container & HTTP Probes)
# ==============================================================================
target:
  container_name: "iow_demo_target"
  service_url: "http://demo_app:5000"
  probe_interval_seconds: 3
  probe_timeout_seconds: 2
  # Seconds of matching log lines collapsed into one incident, so a traceback
  # raises a single crash event instead of one per line.
  incident_debounce_seconds: 1.0
  # Sliding deduplication windows. One bad start must raise one event, so the crash
  # window has to outlast Docker's exponential restart backoff, which tops out at 60 s
  # between crashes (a 60 s window raised the same crash loop again every minute).
  # An incident also ends once the target serves again or a heal is verified.
  # In GitOps mode (make argocd-bonus) the crash window is at least 330 s: Kubernetes
  # backs a crash-looping pod off up to 300 s between restarts.
  # Suggestions use the longer window the subject asks for.
  crash_dedup_window_seconds: 90
  suggestion_dedup_window_seconds: 300
  probe_urls:
    - "/"
    - "/healthz"
    # 4xx -> a *suggestion*: surfaced for a human, never auto-patched.
    - "/api/missing-route"
  # These are regular expressions. Literal parentheses must be escaped, otherwise
  # "(most recent call last)" is read as a capture group and the pattern silently
  # matches nothing at all. Use \w* rather than \b before Error/Exception: there is
  # no word boundary inside "RuntimeError", so "\bError:" would miss it.
  error_patterns:
    - "Traceback \\(most recent call last\\):"
    - "CRITICAL:"
    - "\\w*(?:Error|Exception):"
    - "ModuleNotFoundError"
    - "ImportError"
    - "SyntaxError"

# ==============================================================================
# Analyst Configuration (Local Model & Retrieval)
# ==============================================================================
analyst:
  model: "qwen2.5-coder:1.5b"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 3
  # Watch mode: how often the index reconciles with the target source tree.
  watch_interval_seconds: 3
  # How the model writes a patch. Either way the loop checks, applies and commits the
  # subject's JSON patch {summary, files: [{path, op, content}]} with complete files.
  #   region    - in a file of 30+ lines the model rewrites only the chunk the crash
  #               points at, and the loop builds the full-file JSON patch from it
  #   full_file - the model writes that complete JSON patch itself, every time
  # Measured with qwen2.5-coder:1.5b on demo_app/app.py: region 4 of 9 usable answers on
  # the first ask, full_file 0 of 9 (each cut to a few lines and refused). A larger
  # model may handle full_file.
  patch_strategy: region
